name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'openspec/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (commit SHA or "latest"). Defaults to the current commit SHA.'
        required: false
        default: ''
      skip_smoke_test:
        description: 'Skip the on-prem smoke test after deploy (use sparingly).'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rediska

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - service: core
            context: ./services/core
            dockerfile: ./services/core/Dockerfile
          - service: worker
            context: ./services
            dockerfile: ./services/worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${IMAGE_PREFIX}-${{ matrix.service }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          # Always tag with the commit SHA (immutable). Also push `latest`
          # for push-to-main; on workflow_dispatch we only push the SHA tag
          # to avoid moving `latest` during ad-hoc redeploys.
          if [ "${{ github.event_name }}" = "push" ]; then
            printf 'tags=%s:%s\n%s:latest\n' "${IMAGE}" "${{ github.sha }}" "${IMAGE}" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:%s\n' "${IMAGE}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy
          sparse-checkout-cone-mode: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Resolve target SHA
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "sha=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update.sh on prod
        run: |
          set -euo pipefail
          SHA='${{ steps.target.outputs.sha }}'
          SKIP=''
          if [ '${{ inputs.skip_smoke_test }}' = 'true' ]; then
            SKIP='--skip-smoke-test'
          fi
          # `set -o pipefail` on the remote side ensures we surface the
          # script's exit code rather than swallowing it.
          ssh -o ServerAliveInterval=30 \
              "${{ vars.DEPLOY_HOST }}" \
              "set -o pipefail; cd /opt/rediska && ./scripts/deploy/update.sh ${SHA} ${SKIP}"
