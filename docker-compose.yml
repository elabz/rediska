x-health-defaults: &health_defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

# Cap container logs. Docker's json-file driver rotates by size, not time:
# each service keeps at most 3 files of 50MB and deletes the oldest.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # rediska-nginx was retired in favour of the shared dev-proxy stack at
  # ~/Web/dev-proxy/. The rediska.local vhost now lives in dev-proxy's
  # nginx/conf.d/rediska.local.conf; dev-proxy attaches to rediska-net
  # externally so it can reach rediska-web without any change here.

  rediska-web:
    image: ghcr.io/elabz/rediska-web:${TAG:-latest}
    build: ./apps/web
    container_name: rediska-web
    environment:
      - CORE_API_URL=http://rediska-core:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BASE_URL=${BASE_URL}
    networks: [rediska-net]
    restart: unless-stopped
    logging: *default_logging
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]

  rediska-core:
    image: ghcr.io/elabz/rediska-core:${TAG:-latest}
    build: ./services/core
    container_name: rediska-core
    environment:
      - MYSQL_URL=${MYSQL_URL}
      - REDIS_URL=${REDIS_URL}
      - ELASTIC_URL=${ELASTIC_URL}
      - ATTACHMENTS_PATH=${ATTACHMENTS_PATH}
      - BACKUPS_PATH=${BACKUPS_PATH}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      - INFERENCE_URL=${INFERENCE_URL}
      - INFERENCE_MODEL=${INFERENCE_MODEL}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY}
      - INFERENCE_TIMEOUT=${INFERENCE_TIMEOUT:-300}
      - INFERENCE_CHAT_TEMPLATE=${INFERENCE_CHAT_TEMPLATE:-llama3}
      - INFERENCE_MAX_CONCURRENT=${INFERENCE_MAX_CONCURRENT:-1}
      - INFERENCE_MAX_RETRIES=${INFERENCE_MAX_RETRIES:-4}
      - INFERENCE_RETRY_BASE_DELAY=${INFERENCE_RETRY_BASE_DELAY:-10}
      - EMBEDDINGS_URL=${EMBEDDINGS_URL}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY}

      - PROVIDER_REDDIT_ENABLED=${PROVIDER_REDDIT_ENABLED}
      - PROVIDER_REDDIT_CLIENT_ID=${PROVIDER_REDDIT_CLIENT_ID}
      - PROVIDER_REDDIT_CLIENT_SECRET=${PROVIDER_REDDIT_CLIENT_SECRET}
      - PROVIDER_REDDIT_REDIRECT_URI=${PROVIDER_REDDIT_REDIRECT_URI}
      - PROVIDER_REDDIT_USER_AGENT=${PROVIDER_REDDIT_USER_AGENT}

      - PROVIDER_RATE_QPM_DEFAULT=${PROVIDER_RATE_QPM_DEFAULT}
      - PROVIDER_RATE_CONCURRENCY_DEFAULT=${PROVIDER_RATE_CONCURRENCY_DEFAULT}
      - PROVIDER_RATE_BURST_FACTOR=${PROVIDER_RATE_BURST_FACTOR}

      # Offline geocoding for the location gate (near/far/unclear)
      - HOME_LATITUDE=${HOME_LATITUDE:-40.0}
      - HOME_LONGITUDE=${HOME_LONGITUDE:--75.2}
      - LOCATION_NEAR_THRESHOLD_MILES=${LOCATION_NEAR_THRESHOLD_MILES:-200}

      # User constraints consumed by the deterministic lead gates
      - USER_AGE=${USER_AGE:-45}
      - USER_DS_ORIENTATION=${USER_DS_ORIENTATION:-dominant}

      # Per-dimension agent input budgets
      - ANALYSIS_CONTEXT_MAX_CHARS=${ANALYSIS_CONTEXT_MAX_CHARS:-24000}
      - ANALYSIS_MAX_RECENT_POSTS=${ANALYSIS_MAX_RECENT_POSTS:-10}
      - ANALYSIS_POST_ITEM_CHARS=${ANALYSIS_POST_ITEM_CHARS:-800}

      # Human evaluation: cap on labelled cases per prompt replay
      - EVALUATION_REPLAY_MAX_CASES=${EVALUATION_REPLAY_MAX_CASES:-50}

      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    volumes:
      - ${ATTACHMENTS_PATH:-/var/lib/rediska/attachments}:${ATTACHMENTS_PATH:-/var/lib/rediska/attachments}
      - ${BACKUPS_PATH:-/var/lib/rediska/backups}:${BACKUPS_PATH:-/var/lib/rediska/backups}
    networks: [rediska-net]
    restart: unless-stopped
    logging: *default_logging
    depends_on:
      rediska-mysql:
        condition: service_healthy
      rediska-redis:
        condition: service_healthy
      rediska-elasticsearch:
        condition: service_healthy
    healthcheck:
      <<: *health_defaults
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]

  rediska-worker:
    image: ghcr.io/elabz/rediska-worker:${TAG:-latest}
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    container_name: rediska-worker
    depends_on:
      rediska-core:
        condition: service_healthy
      rediska-redis:
        condition: service_healthy
    environment:
      - MYSQL_URL=${MYSQL_URL}
      - REDIS_URL=${REDIS_URL}
      - ELASTIC_URL=${ELASTIC_URL}
      - ATTACHMENTS_PATH=${ATTACHMENTS_PATH}
      - BACKUPS_PATH=${BACKUPS_PATH}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      - INFERENCE_URL=${INFERENCE_URL}
      - INFERENCE_MODEL=${INFERENCE_MODEL}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY}
      - INFERENCE_TIMEOUT=${INFERENCE_TIMEOUT:-300}
      - INFERENCE_CHAT_TEMPLATE=${INFERENCE_CHAT_TEMPLATE:-llama3}
      - INFERENCE_MAX_CONCURRENT=${INFERENCE_MAX_CONCURRENT:-1}
      - INFERENCE_MAX_RETRIES=${INFERENCE_MAX_RETRIES:-4}
      - INFERENCE_RETRY_BASE_DELAY=${INFERENCE_RETRY_BASE_DELAY:-10}
      - EMBEDDINGS_URL=${EMBEDDINGS_URL}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL}
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY}

      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}

      - PROVIDER_REDDIT_ENABLED=${PROVIDER_REDDIT_ENABLED}
      - PROVIDER_REDDIT_CLIENT_ID=${PROVIDER_REDDIT_CLIENT_ID}
      - PROVIDER_REDDIT_CLIENT_SECRET=${PROVIDER_REDDIT_CLIENT_SECRET}
      - PROVIDER_REDDIT_REDIRECT_URI=${PROVIDER_REDDIT_REDIRECT_URI}
      - PROVIDER_REDDIT_USER_AGENT=${PROVIDER_REDDIT_USER_AGENT}

      - PROVIDER_RATE_QPM_DEFAULT=${PROVIDER_RATE_QPM_DEFAULT}
      - PROVIDER_RATE_CONCURRENCY_DEFAULT=${PROVIDER_RATE_CONCURRENCY_DEFAULT}
      - PROVIDER_RATE_BURST_FACTOR=${PROVIDER_RATE_BURST_FACTOR}

      # Offline geocoding for the location gate (near/far/unclear)
      - HOME_LATITUDE=${HOME_LATITUDE:-40.0}
      - HOME_LONGITUDE=${HOME_LONGITUDE:--75.2}
      - LOCATION_NEAR_THRESHOLD_MILES=${LOCATION_NEAR_THRESHOLD_MILES:-200}

      # User constraints consumed by the deterministic lead gates
      - USER_AGE=${USER_AGE:-45}
      - USER_DS_ORIENTATION=${USER_DS_ORIENTATION:-dominant}

      # Per-dimension agent input budgets
      - ANALYSIS_CONTEXT_MAX_CHARS=${ANALYSIS_CONTEXT_MAX_CHARS:-24000}
      - ANALYSIS_MAX_RECENT_POSTS=${ANALYSIS_MAX_RECENT_POSTS:-10}
      - ANALYSIS_POST_ITEM_CHARS=${ANALYSIS_POST_ITEM_CHARS:-800}

      # Human evaluation: cap on labelled cases per prompt replay
      - EVALUATION_REPLAY_MAX_CASES=${EVALUATION_REPLAY_MAX_CASES:-50}
    volumes:
      - ${ATTACHMENTS_PATH:-/var/lib/rediska/attachments}:${ATTACHMENTS_PATH:-/var/lib/rediska/attachments}
      - ${BACKUPS_PATH:-/var/lib/rediska/backups}:${BACKUPS_PATH:-/var/lib/rediska/backups}
    networks: [rediska-net]
    restart: unless-stopped
    logging: *default_logging

  rediska-beat:
    image: ghcr.io/elabz/rediska-worker:${TAG:-latest}
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    container_name: rediska-beat
    command: ["celery", "-A", "rediska_worker.celery_app", "beat", "-l", "INFO"]
    depends_on:
      rediska-redis:
        condition: service_healthy
      rediska-core:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - MYSQL_URL=${MYSQL_URL}
      - REDIS_URL=${REDIS_URL}
      - ELASTIC_URL=${ELASTIC_URL}
      - ATTACHMENTS_PATH=${ATTACHMENTS_PATH}
      - BACKUPS_PATH=${BACKUPS_PATH}
    volumes:
      - ${ATTACHMENTS_PATH:-/var/lib/rediska/attachments}:${ATTACHMENTS_PATH:-/var/lib/rediska/attachments}
      - ${BACKUPS_PATH:-/var/lib/rediska/backups}:${BACKUPS_PATH:-/var/lib/rediska/backups}
    networks: [rediska-net]
    restart: unless-stopped
    logging: *default_logging

  rediska-redis:
    image: redis:7-alpine
    container_name: rediska-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rediska_redis_data:/data
    networks: [rediska-net]
    restart: unless-stopped
    logging: *default_logging
    healthcheck:
      <<: *health_defaults
      test: ["CMD", "redis-cli", "ping"]

  rediska-mysql:
    image: mysql:8.4
    container_name: rediska-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - rediska_mysql_data:/var/lib/mysql
    networks: [rediska-net]
    restart: unless-stopped
    logging: *default_logging
    healthcheck:
      <<: *health_defaults
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]

  rediska-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: rediska-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - rediska_es_data:/usr/share/elasticsearch/data
    networks: [rediska-net]
    restart: unless-stopped
    logging: *default_logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

networks:
  rediska-net:

volumes:
  rediska_mysql_data:
  rediska_es_data:
  rediska_redis_data:
